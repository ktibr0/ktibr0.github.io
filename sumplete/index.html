<!DOCTYPE html>
<html lang="ru">
  <head>
    <title>Самплет</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="Логическая игра-головоломка, созданная искусственным интеллектом"
    />
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("sw.js")
          .then((registration) => console.log("Service worker registered"))
          .catch((error) =>
            console.log("Service worker registration failed:", error)
          );
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Самплет</h1>
      <h2>Удаляйте числа, чтобы суммы строк и столбцов совпадали с целевыми</h2>
    </header>

    <div id="game-area">
      <div class="grid" id="grid"></div>

      <div class="controls">
        <button id="mistakes">Ошибки</button>
        <button id="hint">Подсказка</button>
        <button id="restart">Начать заново</button>
        <button id="reveal" class="danger">Показать</button>
        <button id="remove" class="hidden danger">Убрать ошибки</button>
      </div>

      <h2 class="complete hidden">🎉 Головоломка решена! Отлично!</h2>
      <h2 class="revealed hidden">В следующий раз повезёт больше!</h2>

      <div class="new hidden">
        <select id="size">
          <option value="3">3×3 (Новичок)</option>
          <option value="4">4×4 (Лёгкий)</option>
          <option value="5">5×5 (Средний)</option>
          <option value="6">6×6 (Сложный)</option>
          <option value="7">7×7 (Продвинутый)</option>
          <option value="8">8×8 (Эксперт)</option>
          <option value="9">9×9 (Мастер)</option>
        </select>
        <button id="new" class="primary">Новая головоломка</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
