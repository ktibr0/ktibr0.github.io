<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8">
  <title>Криптограмма</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="level-screen" role="dialog" aria-modal="true" aria-labelledby="level-title">
    <div class="level-box">
      <h1 class="level-title" id="level-title">Криптограмма</h1>
      <p class="level-subtitle">Расшифруй мудрую цитату.<br>Одинаковое число — одинаковая буква. Выбери клетку и нажми букву.</p>
      <p id="loading-state" role="status">Загружаем цитаты…</p>
      <div class="level-cards">
        <button class="level-card easy" data-level="easy"><span class="level-icon" aria-hidden="true">🌿</span><span class="level-info"><span class="level-name">Легко</span><span class="level-desc">Частые буквы уже открыты</span></span></button>
        <button class="level-card medium" data-level="medium"><span class="level-icon" aria-hidden="true">🕯️</span><span class="level-info"><span class="level-name">Средне</span><span class="level-desc">Нужно подумать над шифром</span></span></button>
        <button class="level-card hard" data-level="hard"><span class="level-icon" aria-hidden="true">🔐</span><span class="level-info"><span class="level-name">Сложно</span><span class="level-desc">Открыто совсем немного букв</span></span></button>
      </div>
      <button id="resume-btn" class="btn secondary hidden" type="button">Продолжить игру</button>
    </div>
  </div>
  <div id="source-error" class="source-error hidden" role="alert">
    <p id="source-error-text">Не удалось загрузить цитаты.</p><button class="btn" id="retry-btn" type="button">Повторить</button>
  </div>
  <header>
    <div class="title">Криптограмма</div>
    <div class="lives" id="lives" aria-label="Осталось жизней"></div>
  </header>
  <main id="puzzle-wrap" aria-label="Поле криптограммы"><div id="puzzle" aria-live="polite"></div></main>
  <div id="hint-row">
    <button class="hint-btn" id="hint-btn" type="button">💡 Подсказка</button>
    <span class="hint-count" id="hint-count">Подсказок: 3</span>
    <button id="new-game-btn" type="button">🔄 Новая</button>
  </div>
  <div id="author-strip">Автор: <span id="author-label"></span></div>
  <section id="keyboard" aria-label="Клавиатура">
    <div class="kb-row" id="kb-row-1"></div><div class="kb-row" id="kb-row-2"></div><div class="kb-row" id="kb-row-3"></div>
  </section>
  <div class="overlay" id="win-overlay" role="dialog" aria-modal="true" aria-labelledby="win-title"><div class="overlay-box"><div class="stars">🌟🌟🌟</div><h2 class="overlay-title" id="win-title">Молодец!</h2><p class="overlay-quote" id="win-quote"></p><p class="overlay-author" id="win-author"></p><button class="btn restart-btn">Играть снова</button></div></div>
  <div class="overlay" id="lose-overlay" role="dialog" aria-modal="true" aria-labelledby="lose-title"><div class="overlay-box"><div class="stars">💔</div><h2 class="overlay-title" id="lose-title">Ошибок слишком много</h2><p class="overlay-quote" id="lose-quote"></p><p class="overlay-author" id="lose-author"></p><button class="btn restart-btn">Попробовать снова</button></div></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
